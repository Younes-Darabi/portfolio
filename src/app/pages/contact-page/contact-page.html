<section>
    <div class="contact_me">
        <h2>{{language.contact.title}}</h2>
    </div>

    <div class="form">
        <form class="contact_form">
            <input type="text" placeholder="{{language.contact.form.name}}" />
            <input type="email" placeholder="{{language.contact.form.email}}" />
            <textarea placeholder="{{language.contact.form.message}}"></textarea>

            <label class="privacy">
                <input type="checkbox" />
                <span>{{language.contact.form.privacyText}}</span>
            </label>

            <button type="submit" disabled>{{language.contact.form.sendButton}}</button>
        </form>
    </div>

    <div class="div_info">
        <span>{{language.contact.invitationTitle}}</span>
        <p>{{language.contact.invitationText}}</p>
        <p class="email"><img>{{language.contact.contactInfo.email}}</p>
        <p class="phone"><img>{{language.contact.contactInfo.tel}}</p>
        <img class="arrow" src="/assets/img/left--.svg" alt="right arrow">
        <p>{{language.contact.links.legalNotice}}</p><br>
        <p>{{language.contact.links.privacyPolicy}}</p><br>
        <p>{{language.contact.footer}}</p><br>
    </div>
    <div class="end_green"></div>
</section>
