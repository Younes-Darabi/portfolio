<section>
    <div class="title">
        <h2>{{language.mySkills.title}}</h2>
    </div>
    <div class="div_skills">
        <p>{{language.mySkills.description}}</p>
        <div>
            @for (item of language.mySkills.technologies; track $index) {
            <div class="single_skill">
                <img src="{{item.image}}" alt="">
                <p>{{item.name}}</p>
            </div>
            }
            <p class="skill_text">{{language.mySkills.challengeMe}}</p>
        </div>
    </div>
    <div class="arrow">
        <img src="/assets/img/right--.svg" alt="right arrow">
    </div>
</section>
